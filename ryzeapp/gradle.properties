org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.caching=true
org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64
# Fast incremental builds (2026-09-06): parallel task execution, incremental Kotlin, long-lived daemon. A one-file edit
# then `tools/fastbuild.sh` (installDebug, no tests) should take seconds. Never use --rerun-tasks for routine builds.
org.gradle.parallel=true
org.gradle.daemon.idletimeout=10800000
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx2g
