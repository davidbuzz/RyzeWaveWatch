# Runs on every push/PR: the Python protocol tests and the Android app's unit tests (no device, no watch).
name: ci
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      # gradle.properties pins org.gradle.java.home to this laptop's JDK path; the -D system property overrides it.
      - run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" --console=plain :app:assembleDebug :app:testDebugUnitTest
        working-directory: ryzeapp
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: ryzeapp/app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore
